<div class="page-container">
  <div class="alert-container" *ngIf="isCreateCategoryFailed">
    <div class="alert-body">
      <span>{{ errorMessage }}</span>
      <button class="close-btn" (click)="closeErrorAlert()">✕</button>
    </div>
  </div>
  <div class="create-category-card">
    <div class="card-header">
      <div class="icon">📂</div>
      <h2>{{'create-category' | translate}}</h2>
      <p>Create a category for your educational test</p>
    </div>
    <form [formGroup]="form" (ngSubmit)="onSubmit(testId)">
      <!-- Category Name -->
      <div class="form-group">
        <label>{{'name' | translate}}</label>
        <input type="text" formControlName="name" placeholder="Category name">
        <small class="error" *ngIf="form.controls['name'].invalid && (form.controls['name'].dirty || form.controls['name'].touched)">
          <span *ngIf="form.controls['name'].errors?.['required']">
            {{'valid-category-name'|translate}}
          </span>
          <span *ngIf="form.controls['name'].errors?.['pattern']">
            {{'not-valid-category-name'|translate}}
          </span>
        </small>
      </div>
      <div class="form-group">
        <label>{{'mark' | translate}}</label>
        <input type="number" formControlName="mark" placeholder="Maximum mark">
        <small class="error" *ngIf="form.controls['mark'].invalid &&(form.controls['mark'].dirty || form.controls['mark'].touched)">
          <span *ngIf="form.controls['mark'].errors?.['required']">
            {{'valid-mark'|translate}}
          </span>
          <span *ngIf="form.controls['mark'].errors?.['pattern']">
            {{'not-valid-mark'|translate}}
          </span>
        </small>
      </div>
      <div class="form-group">
        <label>{{'count' | translate}}</label>
        <input type="number" formControlName="count" placeholder="Number of questions">
        <small class="error"*ngIf="form.controls['count'].invalid && (form.controls['count'].dirty || form.controls['count'].touched)">
          <span *ngIf="form.controls['count'].errors?.['required']">
            {{'valid-count'|translate}}
          </span>
          <span *ngIf="form.controls['count'].errors?.['pattern']">
            {{'not-valid-count'|translate}}
          </span>
        </small>
      </div>
      <button
        type="submit"
        class="create-btn"
        [disabled]="form.invalid">
        {{'create' | translate}}
      </button>
    </form>
  </div>
</div>
