<div class="page-container">

  <div class="alert-container" *ngIf="isAddUserToClassFailed">
    <div class="alert-card">
      <span>{{ errorMessage }}</span>
      <button type="button" class="close-btn" (click)="closeErrorAlert()">✕</button>
    </div>
  </div>

  <div class="form-card">
    <div class="form-header">
      <h2>{{'add-student-to-class' | translate}}</h2>
      <p>{{'fill-student-information' | translate}}</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">

      <!-- Email -->
      <div class="input-group">
        <label for="email">
          {{'email' | translate}}
          <span class="required">*</span>
        </label>

        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="student@email.com">

        <div
          class="error-message"
          *ngIf="form.controls['email'].invalid &&
                 (form.controls['email'].dirty || form.controls['email'].touched)">

          <span *ngIf="form.controls['email'].errors?.['required']">
            {{'valid-email' | translate}}
          </span>

          <span *ngIf="form.controls['email'].errors?.['pattern']">
            {{'email-not-valid' | translate}}
          </span>
        </div>
      </div>

      <!-- Class -->
      <div class="input-group">
        <label for="className">
          {{'class-name' | translate}}
          <span class="required">*</span>
        </label>

        <input
          id="className"
          type="text"
          formControlName="className"
          placeholder="11-A">

        <div
          class="error-message"
          *ngIf="form.controls['className'].invalid &&
                 (form.controls['className'].dirty || form.controls['className'].touched)">

          <span *ngIf="form.controls['className'].errors?.['required']">
            {{'valid-classname' | translate}}
          </span>

          <span *ngIf="form.controls['className'].errors?.['pattern']">
            {{'classname-not-valid' | translate}}
          </span>
        </div>
      </div>

      <div class="button-group">
        <button
          type="submit"
          class="primary-btn"
          [disabled]="form.invalid">
          {{'add-user' | translate}}
        </button>

        <button
          type="button"
          class="secondary-btn"
          (click)="goBack($event)">
          {{'back' | translate}}
        </button>
      </div>

    </form>
  </div>
</div>
