<div class="page-container">
  <div class="alert-container" *ngIf="isCreateRelationFailed">
    <div class="alert-body" role="alert">
      <span class="alert-icon">⚠️</span>
      <span class="alert-text">
        {{ errorMessage }}
      </span>
      <button type="button" class="close-btn" (click)="closeErrorAlert()" aria-label="Close">
        ✕
      </button>
    </div>
  </div>
  <div class="create-relation-card">
    <div class="card-header">
      <div class="icon">👨‍👩‍👧</div>
      <h2>
        {{ 'create-relation' | translate }}
      </h2>
      <p>
        Connect a parent account with a student
      </p>
    </div>
    <form [formGroup]="form" novalidate (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="parentsEmail">
          {{ 'parents-email' | translate }}
          <span class="required">*</span>
        </label>
        <input id="parentsEmail" name="parentsEmail" type="email" autocomplete="email" formControlName="parentsEmail" placeholder="Enter parent's email"
          [class.input-error]=" form.controls['parentsEmail'].invalid && (form.controls['parentsEmail'].dirty || form.controls['parentsEmail'].touched)">
        <div class="error-message"
          *ngIf="form.controls['parentsEmail'].invalid && (form.controls['parentsEmail'].dirty || form.controls['parentsEmail'].touched)">
          <span
            *ngIf="form.controls['parentsEmail'].errors?.['required']">
            {{ 'valid-parents-email' | translate }}
          </span>
          <span
            *ngIf="form.controls['parentsEmail'].errors?.['pattern']">
            {{ 'not-valid-parents-email' | translate }}
          </span>
        </div>
      </div>
      <div class="form-group">
        <label for="studentEmail">
          {{ 'student-email' | translate }}
          <span class="required">*</span>
        </label>
        <input id="studentEmail" name="studentEmail" type="email" autocomplete="email"formControlName="studentEmail"placeholder="Enter student's email"
          [class.input-error]="form.controls['studentEmail'].invalid && (form.controls['studentEmail'].dirty || form.controls['studentEmail'].touched)">
        <div class="error-message" *ngIf="form.controls['studentEmail'].invalid && (form.controls['studentEmail'].dirty || form.controls['studentEmail'].touched)">
          <span
            *ngIf="form.controls['studentEmail'].errors?.['required']">
            {{ 'valid-student-email' | translate }}
          </span>
          <span
            *ngIf="form.controls['studentEmail'].errors?.['pattern']">
            {{ 'not-valid-student-email' | translate }}
          </span>
        </div>
      </div>
      <div class="button-container">
        <button type="submit" class="create-btn" [disabled]="form.invalid"> {{ 'create' | translate }}</button>
        <button type="button" class="back-btn" (click)="goBack($event)">
          {{ 'back' | translate }}
        </button>
      </div>
    </form>
  </div>
</div>
